<!DOCTYPE html>
<html lang="en">
<title> Matt Kamp inflation</title>
<head>

  <style>
    #matt-kemp {
      width: 200px;
      height: auto;
      transition: width 0.3s;
    }
    .controls {
      margin-top: 1em;
    }
    .controls button {
      margin-right: 0.5em;
    }
    .in-middle {
      display: block; 
      margin-left: auto;
      margin-right: auto; 
      width: 50%;
    }
  </style>
</head>
<body>
  <img id="matt-kemp" class="in-middle" src="7e7c9f53_br_lad.jpg" alt="Matt Kemp">

  <div class="controls">
    <button id="inflation" class="in-middle">Inflation</button>
    <button id="deflation" class="in-middle">Deflation</button>
    <button id="reset" class="in-middle">Pop Him</button>
  </div>

  <script>
    const img = document.getElementById("matt-kemp");
    const inflation = document.getElementById("inflation");
    const deflation = document.getElementById("deflation");
    const reset = document.getElementById("reset");

    const ORIGINAL_WIDTH = 200;
    const STEP = 20;

    function setWidth(width) {
      img.style.width = width + "px";
    }

    inflation.addEventListener("click", () => {
      const current = img.clientWidth;
      setWidth(current + STEP);
    });

    deflation.addEventListener("click", () => {
      const current = img.clientWidth;
      setWidth(Math.max(50, current - STEP));
    });

    reset.addEventListener("click", () => {
      setWidth(ORIGINAL_WIDTH);
    });
  </script>
</body>
<footer style="align-items: center;" class="in-middle">
  ©foot finder
</footer>
</html>
